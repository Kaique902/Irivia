<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0c14"/>
      <stop offset="100%" stop-color="#12121e"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.12"/>
  <g transform="translate(256,256)">
    <!-- Book shadow -->
    <ellipse cx="0" cy="92" rx="140" ry="16" fill="#f97316" opacity="0.08"/>
    <!-- Left page (cyan) -->
    <path d="M-8,-80 L-130,-50 L-130,60 L-8,90 Z" fill="url(#page)" opacity="0.85" rx="4"/>
    <!-- Right page (cyan, lighter) -->
    <path d="M8,-80 L130,-50 L130,60 L8,90 Z" fill="#06b6d4" opacity="0.55" rx="4"/>
    <!-- Spine -->
    <rect x="-8" y="-82" width="16" height="174" rx="4" fill="url(#spine)"/>
    <!-- Spine highlight -->
    <rect x="-3" y="-76" width="6" height="162" rx="2" fill="white" opacity="0.08"/>
    <!-- Left page lines -->
    <line x1="-10" y1="-40" x2="-95" y2="-18" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <line x1="-10" y1="-18" x2="-95" y2="4" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
    <line x1="-10" y1="4" x2="-95" y2="26" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
    <line x1="-10" y1="26" x2="-70" y2="42" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.1"/>
    <!-- Right page lines -->
    <line x1="10" y1="-40" x2="95" y2="-18" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.15"/>
    <line x1="10" y1="-18" x2="95" y2="4" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.1"/>
    <line x1="10" y1="4" x2="95" y2="26" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.08"/>
    <!-- Star accent -->
    <circle cx="102" cy="-62" r="18" fill="#f97316" opacity="0.15"/>
    <text x="102" y="-55" text-anchor="middle" font-size="22" fill="#f97316" opacity="0.7">✦</text>
  </g>
</svg>